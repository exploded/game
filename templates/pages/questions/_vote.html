{{/* The vote button. . is a question row with ID, Votes and Voted. Works
without JavaScript; htmx swaps in the updated button. */}}
{{define "vote"}}<form method="POST" action="/questions/{{.ID}}/vote" hx-post="/questions/{{.ID}}/vote" hx-swap="outerHTML" style="flex-shrink:0">
    <button type="submit" aria-pressed="{{.Voted}}" aria-label="{{.Votes}} votes. {{if .Voted}}Remove your vote{{else}}Vote for this question{{end}}" title="{{if .Voted}}Remove your vote{{else}}Vote for this question{{end}}"
        style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:52px;height:56px;border-radius:var(--radius);cursor:pointer;font:inherit;{{if .Voted}}background:var(--color-primary);color:#fff;border:1px solid var(--color-primary);{{else}}background:var(--color-surface-2);color:var(--color-text);border:1px solid var(--color-border);{{end}}">
        <span aria-hidden="true" style="font-size:12px;line-height:1">&#9650;</span>
        <span style="font-size:16px;font-weight:600">{{.Votes}}</span>
    </button>
</form>{{end}}

{{/* The htmx response to a vote: render passes PageData. */}}
{{define "vote-response"}}{{template "vote" .Item}}{{end}}
