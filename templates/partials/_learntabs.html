{{/* The Learn hub's header and tabs, on the Learn and course pages. . is
PageData; .Extra.Tab names the open tab (learnPage sets it; the front of
Learn has none). */}}
{{define "learntabs"}}{{$tab := index .Extra "Tab"}}
<div class="learn-head">
    <a href="/learn" class="learn-brand"{{if not $tab}} aria-current="page"{{end}}>Learn with Rob</a>
    <nav class="learn-tabs segmented" aria-label="Learn">
        <a href="/learn/courses"{{if eq $tab "courses"}} aria-current="page"{{end}}>Courses</a>
        <a href="/learn/videos"{{if eq $tab "videos"}} aria-current="page"{{end}}>Videos</a>
        <a href="/learn/live"{{if eq $tab "live"}} aria-current="page"{{end}}>Live{{with .LiveNow}} <span class="live-dot" aria-label="on now"></span>{{end}}</a>
        <a href="/learn/questions"{{if eq $tab "questions"}} aria-current="page"{{end}}>Ask Rob</a>
    </nav>
</div>
{{end}}
