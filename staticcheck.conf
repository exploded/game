# staticcheck settings (CI runs staticcheck v0.8.2: .github/workflows/deploy.yml).
#
# "inherit" keeps staticcheck's default checks. ST1005 (error strings start
# lower-case and have no full stop) is off because some handler errors are
# shown to people word for word, as sentences: the course cover upload
# (internal/handler/course_cover.go) and Fill from Vimeo
# (internal/handler/courses_vimeo.go).
checks = ["inherit", "-ST1005"]
