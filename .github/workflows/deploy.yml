name: Test and Deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      # internal/db must be what sqlc generates from sql/. The release binary
      # (checksum from the v1.31.1 release page) saves building sqlc, which
      # compiles a C Postgres parser and takes minutes.
      - name: Check sqlc output is current
        run: |
          curl -fsSL -o /tmp/sqlc.tar.gz https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz
          echo "497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz" | sha256sum -c -
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          /tmp/sqlc diff

      # Settings in staticcheck.conf.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # -race needs cgo. The race build runs every test, so there's no
      # separate plain run.
      - name: Run tests (race detector)
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Check for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      # The calculators' sums against Rob's spreadsheets and closed-form
      # answers. ASIC's calculator relief needs a 7-year record, so the checks
      # live in git (testdata/calculators).
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Calculator tests
        run: node --test "testdata/calculators/*.test.mjs"

  deploy:
    name: Deploy to Production
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Download dependencies
        run: go mod download

      - name: Build Linux binary
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o game ./cmd/server/

      # Templates, static files and the schema are embedded in the binary,
      # so the bundle is just the binary and the deploy script. The script
      # goes at the top of the bundle too: the server's script from March
      # 2026 only looks for its update there, so until 6 November 2026 it
      # never installed scripts/deploy-game. Once installed, the repo's
      # script updates itself from scripts/deploy-game.
      - name: Put the deploy script where the old one looks
        run: cp scripts/deploy-game deploy-game

      - name: Copy files to server
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          source: "game,deploy-game,scripts/deploy-game"
          target: "/tmp/game-deploy"
          overwrite: true

      - name: Stop service before deploy
        continue-on-error: true
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: sudo systemctl stop game

      - name: Install and restart service
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || '22' }}
          script: sudo /usr/local/bin/deploy-game /tmp/game-deploy
